<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Alunos</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <header class="topo">
            <div class="topo-conteudo">
                <a class="marca" th:href="@{/}"><span class="marca-icone">&#127891;</span>Controle de Cursos</a>
                <nav class="menu">
                    <a th:href="@{/}">Início</a>
                    <a th:href="@{/cursos}">Cursos</a>
                    <a th:href="@{/alunos}" class="ativo">Alunos</a>
                    <a th:href="@{/matriculas}">Matrículas</a>
                    <a th:href="@{/relatorios}">Relatórios</a>
                </nav>
            </div>
        </header>

        <main class="pagina">
            <header class="cabecalho">
                <div>
                    <p class="eyebrow">Controle de cursos</p>
                    <h1>Alunos cadastrados</h1>
                    <p class="subtitulo">Gerencie os dados de todos os alunos.</p>
                </div>
                <a class="botao-novo" th:href="@{/alunos/novo}">+ Novo aluno</a>
            </header>

            <div th:if="${erro != null}" class="alerta mensagem-erro" th:text="${erro}"></div>

            <section class="cartao-lista" th:unless="${#lists.isEmpty(alunos)}">
                <div class="tabela-responsiva">
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>E-mail</th>
                                <th>Telefone</th>
                                <th>CPF</th>
                                <th class="coluna-acoes">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="aluno : ${alunos}">
                                <td class="destaque" th:text="${aluno.nome}"></td>
                                <td th:text="${aluno.email}"></td>
                                <td th:text="${aluno.telefone}"></td>
                                <td th:text="${aluno.cpf}"></td>
                                <td>
                                    <div class="acoes-tabela">
                                        <form th:action="@{/alunos/editar/{id}(id=${aluno.id})}" method="get">
                                            <button class="botao-acao editar" type="submit">Editar</button>
                                        </form>
                                        <form th:action="@{/alunos/excluir/{id}(id=${aluno.id})}" method="get"
                                              onsubmit="return confirm('Deseja realmente excluir este aluno?');">
                                            <button class="botao-acao excluir" type="submit">Excluir</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="vazio" th:if="${#lists.isEmpty(alunos)}">
                <h2>Nenhum aluno cadastrado</h2>
                <p>Adicione alunos para poder matriculá-los nos cursos.</p>
                <a class="botao-novo" th:href="@{/alunos/novo}">Cadastrar aluno</a>
            </section>
        </main>
    </body>
</html>
