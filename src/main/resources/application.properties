spring.application.name=controle-cursos

# Banco de dados PostgreSQL (crie antes o banco "controle_cursos")
# Os valores abaixo podem ser trocados por variaveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/controle_cursos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# data e hora no formato ISO (necessario para os campos type="date" e type="time" na edicao)
spring.mvc.format.date=iso
spring.mvc.format.time=iso
